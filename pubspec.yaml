name: universal_share
description: "Universal Share - Cross-platform local file transfer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  nsd: ^5.0.1
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.1
  dio: ^5.4.3
  multicast_dns: ^0.3.3
  network_info_plus: ^6.0.1

  # Security / TLS
  basic_utils: ^5.7.0
  pointycastle: ^3.7.3
  crypto: ^3.0.3

  # Local storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # File handling
  file_picker: ^8.0.1
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # UI / Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.4.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  windows:
    generate: true
    image_path: "assets/icons/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/
    - assets/lottie/